version: '3.9'

services:
  expense-tracker:
    image: expense-tracker:local
    container_name: expense-tracker
    restart: always
    environment:
      SERVER_PORT: 8080
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: expense_tracker
      DB_USERNAME: expense_user
      DB_PASSWORD: change-me
      DB_PARAMS: useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-5.4-nano
      OPENAI_API_KEY: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
